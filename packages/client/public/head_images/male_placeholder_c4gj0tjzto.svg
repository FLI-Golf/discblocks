<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Blue sky gradient background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="50%" style="stop-color:#5BA3D9"/>
      <stop offset="100%" style="stop-color:#2F91F6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#skyGradient)"/>
  
  <!-- Subtle cloud hints -->
  <ellipse cx="30" cy="35" rx="25" ry="12" fill="white" opacity="0.3"/>
  <ellipse cx="170" cy="50" rx="20" ry="10" fill="white" opacity="0.25"/>
  <ellipse cx="160" cy="25" rx="15" ry="8" fill="white" opacity="0.2"/>
  
  <!-- Hair (short style) -->
  <ellipse cx="100" cy="75" rx="48" ry="35" fill="#2D1F14"/>
  
  <!-- Neck -->
  <rect x="82" y="150" width="36" height="50" fill="#E8C4B8"/>
  
  <!-- Shoulders hint -->
  <ellipse cx="100" cy="195" rx="55" ry="22" fill="#7C3AED"/>
  
  <!-- Face -->
  <ellipse cx="100" cy="105" rx="45" ry="52" fill="#E8C4B8"/>
  
  <!-- Hair (front layer - short cut) -->
  <path d="M55 85 Q60 60 80 55 Q100 50 120 55 Q140 60 145 85 Q135 70 100 68 Q65 70 55 85" fill="#2D1F14"/>
  
  <!-- Eyebrows (thicker, masculine) -->
  <path d="M70 92 Q80 88 92 91" stroke="#1F1510" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M108 91 Q120 88 130 92" stroke="#1F1510" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Eyes -->
  <ellipse cx="80" cy="103" rx="9" ry="5" fill="white"/>
  <ellipse cx="120" cy="103" rx="9" ry="5" fill="white"/>
  <circle cx="80" cy="103" r="4.5" fill="#4A6741"/>
  <circle cx="120" cy="103" r="4.5" fill="#4A6741"/>
  <circle cx="81" cy="102" r="1.5" fill="white"/>
  <circle cx="121" cy="102" r="1.5" fill="white"/>
  
  <!-- Nose (more prominent) -->
  <path d="M100 105 Q104 118 100 128 Q96 132 100 133 Q104 132 100 128" stroke="#D4B0A0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Smile -->
  <path d="M82 142 Q100 152 118 142" stroke="#B8756E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Lips -->
  <ellipse cx="100" cy="144" rx="14" ry="5" fill="#C4847D"/>
  
  <!-- Subtle stubble/shadow -->
  <ellipse cx="100" cy="155" rx="30" ry="12" fill="#2D1F14" opacity="0.08"/>
  
  <!-- Ears -->
  <ellipse cx="52" cy="105" rx="8" ry="12" fill="#E8C4B8"/>
  <ellipse cx="148" cy="105" rx="8" ry="12" fill="#E8C4B8"/>
</svg>
