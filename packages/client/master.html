<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Avatar</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1726; color: #edf4ff; font-family: sans-serif; }
      #master { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
      #master-head { padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,.1); display: flex; align-items: baseline; gap: 14px; }
      #master-head h1 { font-size: 18px; margin: 0; letter-spacing: .1em; text-transform: uppercase; }
      #master-head .sub { font-size: 12px; color: #9fb3cc; }
      #master-head .nav { margin-left: auto; font-size: 12px; }
      #master-head .nav a { color: #5eead4; text-decoration: none; margin-left: 12px; }
      #master-body { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
      #preview { position: relative; min-width: 0; min-height: 0; }
      #canvas { width: 100%; height: 100%; display: block; min-width: 0; min-height: 0; }
      #refimg { position: absolute; top: 12px; right: 12px; width: 180px; background: rgba(10,17,28,.9); border: 1px dashed rgba(255,255,255,.2); border-radius: 10px; padding: 10px; font-size: 11px; color: #9fb3cc; }
      #refimg .lbl { font-weight: 700; color: #5eead4; margin-bottom: 6px; letter-spacing: .06em; text-transform: uppercase; }
      #refimg img { width: 100%; border-radius: 6px; display: block; margin-top: 6px; }
      #features { background: rgba(10,17,28,.96); border-left: 1px solid rgba(255,255,255,.12); overflow-y: auto; padding: 14px; }
      #features .ftitle { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #9fb3cc; margin-bottom: 10px; }
      .sect { border: 1px solid rgba(255,255,255,.08); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
      .sect-head { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 9px 12px; background: rgba(255,255,255,.03); border: none; color: #edf4ff; font-size: 13px; font-weight: 600; cursor: pointer; }
      .sect-head:hover { background: rgba(255,255,255,.06); }
      .sect-body { padding: 10px 14px; border-top: 1px solid rgba(255,255,255,.06); }
      .sect-body[hidden] { display: none; }
      .soon { color: #64748b; font-size: 12px; font-style: italic; }
      .row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; margin: 8px 0; font-size: 12px; }
      .row output { color: #ffd54a; font-size: 11px; }
      .row input[type=range] { grid-column: 1/-1; width: 100%; accent-color: #ffd54a; }
      #master-foot { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid rgba(255,255,255,.1); }
      #master-foot button { padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255,213,74,.3); background: transparent; color: #edf4ff; cursor: pointer; }
      #master-foot button.is-active { background: rgba(255,213,74,.16); color: #ffd54a; border-color: rgba(255,213,74,.5); }
      #camdebug { margin-left: auto; font-size: 10px; font-family: monospace; color: #64748b; align-self: center; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="master">
      <div id="master-head">
        <h1>Master Avatar</h1>
        <span class="sub">Avatar Rig &amp; Pose Authoring</span>
        <span class="nav">
          <a href="/master.html">Master</a>
          <a href="/shoulder-test.html">Shoulder Diagnostic</a>
        </span>
      </div>
      <div id="master-body">
        <div id="preview">
          <canvas id="canvas"></canvas>
          <div id="refimg">
            <div class="lbl">Reference Image</div>
            <div id="ref-body"><span class="soon">Drop an image to guide posing</span></div>
          </div>
        </div>
        <div id="features">
          <div class="ftitle">Body Features</div>
          <div id="feature-list"></div>
        </div>
      </div>
      <div id="master-foot">
        <div id="views"></div>
        <div id="camdebug"></div>
      </div>
    </div>
    <script type="module" src="/src/master.ts"></script>
  </body>
</html>
