<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Avatar</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1726; color: #edf4ff; font-family: sans-serif; }
      #master { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
      #master-head { padding: 12px 18px; border-bottom: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 14px; }
      #master-head h1 { font-size: 18px; margin: 0; letter-spacing: .1em; text-transform: uppercase; }
      #master-head .sub { font-size: 12px; color: #9fb3cc; }
      #baseline { font-size: 10px; color: #5eead4; letter-spacing: .1em; text-transform: uppercase; border: 1px solid rgba(94,234,212,.4); padding: 2px 8px; border-radius: 6px; }
      #mode-badge { font-size: 10px; color: #ffd54a; letter-spacing: .1em; text-transform: uppercase; border: 1px solid rgba(255,213,74,.4); padding: 2px 8px; border-radius: 6px; }
      #master-head .hgroup { display: flex; align-items: center; gap: 10px; margin-left: 8px; }
      .hbtn { padding: 5px 12px; border-radius: 7px; border: 1px solid rgba(255,255,255,.25); background: transparent; color: #edf4ff; cursor: pointer; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
      .hbtn:hover:not(:disabled) { background: rgba(255,255,255,.08); }
      .hbtn:disabled { opacity: .4; cursor: not-allowed; }
      #btn-save { border-color: rgba(94,234,212,.5); color: #5eead4; }
      #btn-final { border-color: rgba(255,213,74,.5); color: #ffd54a; }
      #save-status { font-size: 11px; margin-left: 4px; }
      #save-status[data-state=unsaved] { color: #fbbf24; }
      #save-status[data-state=saved] { color: #5eead4; }
      #save-status[data-state=final] { color: #4ade80; }
      #save-status[data-state=flash] { color: #4ade80; font-weight: 700; }
      .confirm-overlay { position: fixed; inset: 0; background: rgba(4,8,14,.72); display: flex; align-items: center; justify-content: center; z-index: 100; }
      .confirm-box { background: #0f1c2e; border: 1px solid rgba(255,255,255,.15); border-radius: 12px; padding: 20px 24px; max-width: 380px; }
      .confirm-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
      .confirm-body { font-size: 12px; color: #9fb3cc; margin-bottom: 16px; line-height: 1.5; }
      .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }
      #master-head .nav { margin-left: auto; font-size: 12px; }
      #master-head .nav a { color: #5eead4; text-decoration: none; margin-left: 12px; }

      #master-body { display: grid; grid-template-columns: 300px 1fr 340px; min-height: 0; }
      .menu { background: rgba(10,17,28,.96); overflow-y: auto; padding: 14px; }
      #menu-left { border-right: 1px solid rgba(255,255,255,.12); }
      #menu-right { border-left: 1px solid rgba(255,255,255,.12); }
      #preview { position: relative; min-width: 0; min-height: 0; }
      #canvas { width: 100%; height: 100%; display: block; min-width: 0; min-height: 0; }

      #master-foot { display: flex; gap: 8px; padding: 10px 18px; border-top: 1px solid rgba(255,255,255,.1); align-items: center; }
      #views { display: flex; gap: 8px; }
      #views button, #master-foot>button { padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,213,74,.3); background: transparent; color: #edf4ff; cursor: pointer; }
      #views button.is-active { background: rgba(255,213,74,.16); color: #ffd54a; border-color: rgba(255,213,74,.5); }
      #lower { display: flex; gap: 8px; margin-left: 12px; flex-wrap: wrap; align-items: flex-end; }
      #lower .ftitle { margin: 0; align-self: center; }
      #lower .sect { position: relative; margin-bottom: 0; }
      #lower .sect-head { padding: 8px 12px; font-size: 12px; white-space: nowrap; }
      #lower .sect-body { position: absolute; bottom: 100%; left: 0; margin-bottom: 6px; min-width: 220px; background: rgba(11,23,38,.98); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; z-index: 20; box-shadow: 0 -8px 24px rgba(0,0,0,.4); }
      #camdebug { margin-left: auto; font-size: 10px; font-family: monospace; color: #64748b; white-space: pre; }

      .ftitle { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #9fb3cc; margin: 4px 0 10px; }
      .sect { border: 1px solid rgba(255,255,255,.08); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
      .sect-head { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 9px 12px; background: rgba(255,255,255,.03); border: none; color: #edf4ff; font-size: 13px; font-weight: 600; cursor: pointer; }
      .sect-head:hover { background: rgba(255,255,255,.06); }
      .sect-body { padding: 10px 14px; border-top: 1px solid rgba(255,255,255,.06); }
      .sect-body[hidden] { display: none; }
      .soon { color: #64748b; font-size: 12px; font-style: italic; }
      .row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; margin: 8px 0; font-size: 12px; }
      .row output { color: #ffd54a; font-size: 11px; }
      .row input[type=range] { grid-column: 1/-1; width: 100%; accent-color: #ffd54a; }

      /* Adaptive authoring slider: label/value on row 1, [−] slider [+] [⟲] + precision on row 2. */
      .authoring-slider { grid-template-columns: 1fr auto; }
      .authoring-slider .range-btn { padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.05); color: #edf4ff; font-size: 13px; line-height: 1; cursor: pointer; }
      .authoring-slider .range-btn:hover { background: rgba(255,213,74,.16); border-color: rgba(255,213,74,.5); color: #ffd54a; }
      .authoring-slider input[type=range] { grid-column: auto; width: 100%; }
      .authoring-slider .precision { display: inline-flex; gap: 3px; grid-column: 1/-1; }
      .authoring-slider .precision .range-btn { padding: 1px 7px; font-size: 10px; }
      .authoring-slider .precision .range-btn.active { background: rgba(255,213,74,.16); color: #ffd54a; border-color: rgba(255,213,74,.5); }

      .appearance-inline { margin-bottom: 6px; }
      .appearance-mode-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
      .appearance-mode-button { flex: 1; padding: 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,.14); background: transparent; color: #edf4ff; cursor: pointer; font-size: 12px; }
      .appearance-mode-button.is-active { background: rgba(255,213,74,.16); color: #ffd54a; border-color: rgba(255,213,74,.5); }
      .face-section { border: 1px solid rgba(255,255,255,.08); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
      .face-section-header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 9px 12px; background: rgba(255,255,255,.03); border: none; color: #edf4ff; font-size: 13px; font-weight: 600; cursor: pointer; }
      .face-section-header:hover { background: rgba(255,255,255,.06); }
      .face-section-title { font-weight: 600; }
      .face-section-summary { color: #ffd54a; font-size: 11px; margin-left: auto; margin-right: 8px; }
      .face-section-content { padding: 10px 14px; border-top: 1px solid rgba(255,255,255,.06); }
      .face-section-content[hidden] { display: none; }
      .appearance-face-group-heading { margin: 12px 0 4px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #9fb3cc; }
      .appearance-control { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; margin: 8px 0; font-size: 12px; color: #edf4ff; }
      .appearance-control output { color: #ffd54a; font-size: 11px; }
      .appearance-control input[type=range] { grid-column: 1/-1; width: 100%; accent-color: #ffd54a; }
      .appearance-control input[type=color] { width: 100%; min-height: 30px; border-radius: 8px; border: 1px solid rgba(255,213,74,.28); background: rgba(10,17,28,.96); }
    </style>
  </head>
  <body>
    <div id="master">
      <div id="master-head">
        <h1>Master Avatar</h1>
        <span class="sub">Avatar Rig &amp; Pose Authoring</span>
        <div class="hgroup">
          <span id="baseline">Male Baseline</span>
          <span id="mode-badge">Default Creation</span>
          <button id="btn-save" class="hbtn" type="button">Save</button>
          <button id="btn-final" class="hbtn" type="button">Final</button>
          <button id="btn-save-pose" class="hbtn" type="button" disabled title="Available in Pose Creation mode">Save Pose</button>
          <span id="save-status" data-state="saved">Saved</span>
        </div>
        <span class="nav">
          <a href="/master.html">Master</a>
          <a href="/shoulder-test.html">Shoulder Diagnostic</a>
        </span>
      </div>
      <div id="master-body">
        <div id="menu-left" class="menu">
          <div class="ftitle">Body Features</div>
          <div id="feature-left"></div>
        </div>
        <div id="preview"><canvas id="canvas"></canvas></div>
        <div id="menu-right" class="menu">
          <div class="ftitle">Change Look</div>
          <div id="feature-right"></div>
        </div>
      </div>
      <div id="master-foot">
        <div id="views"></div>
        <div id="camdebug"></div>
      </div>
    </div>
    <script type="module" src="/src/master.ts"></script>
  </body>
</html>
