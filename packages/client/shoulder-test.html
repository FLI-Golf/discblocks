<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoulder Adapter Test</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1726; color: #edf4ff; font-family: sans-serif; }
      #wrap { display: grid; grid-template-columns: 320px 1fr 340px; height: 100vh; }
      #left { background: rgba(10,17,28,.96); border-right: 1px solid rgba(255,255,255,.12); display: flex; flex-direction: column; overflow: hidden; }
      #left-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
      #left-head strong { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #9fb3cc; }
      #left-body { overflow-y: auto; flex: 1; padding: 12px; }
      #left-body button { width: 100%; padding: 9px; margin: 5px 0; border-radius: 8px; border: 1px solid rgba(255,213,74,.3); background: transparent; color: #edf4ff; cursor: pointer; font-size: 13px; text-align: left; }
      #left-body button:hover { background: rgba(255,213,74,.08); }
      #canvas { width: 100%; height: 100%; display: block; min-width: 0; min-height: 0; }
      #panel { padding: 16px; overflow-y: auto; background: rgba(10,17,28,.96); border-left: 1px solid rgba(255,255,255,.12); }
      h1 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #9fb3cc; }
      .row { margin: 14px 0; }
      .row label { display: flex; justify-content: space-between; font-size: 13px; color: #cfe0f6; }
      .row output { color: #ffd54a; }
      input[type=range] { width: 100%; accent-color: #ffd54a; }
      .views { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
      .views button { flex: 1; padding: 6px 4px; border-radius: 8px; border: 1px solid rgba(255,213,74,.28); background: rgba(10,17,28,.96); color: #edf4ff; cursor: pointer; font-size: 12px; }
      .views button.is-active { background: rgba(255,213,74,.16); color: #ffd54a; }
      #reset { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,213,74,.4); background: transparent; color: #ffd54a; cursor: pointer; margin-top: 14px; }
      .grp { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: #5eead4; margin: 16px 0 4px; }
      #debug, #camdebug { margin-top: 10px; font-size: 11px; font-family: monospace; white-space: pre; background: rgba(0,0,0,.3); padding: 10px; border-radius: 8px; color: #9fb3cc; }
      #camdebug { color: #5eead4; }
      .sect { margin-top: 18px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #9fb3cc; border-top: 1px solid rgba(255,255,255,.08); padding-top: 12px; }
      #docs-overlay { position: fixed; inset: 0; background: rgba(3,8,16,.8); z-index: 50; display: flex; align-items: center; justify-content: center; }
      #docs-overlay[hidden] { display: none; }
      #docs-modal { width: min(92vw, 900px); height: 82vh; background: rgba(11,23,38,.98); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
      #docs-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
      #docs-close { background: none; border: none; color: #edf4ff; font-size: 18px; cursor: pointer; }
      #docs-body { display: grid; grid-template-columns: 220px 1fr; flex: 1; min-height: 0; }
      #docs-nav { border-right: 1px solid rgba(255,255,255,.08); overflow-y: auto; padding: 8px; }
      #docs-nav button { display: block; width: 100%; text-align: left; padding: 7px 10px; margin: 2px 0; background: none; border: none; border-radius: 8px; color: #cfe0f6; cursor: pointer; font-size: 13px; }
      #docs-nav button:hover { background: rgba(255,255,255,.06); }
      #docs-nav button.is-active { background: rgba(255,213,74,.16); color: #ffd54a; }
      #docs-content { overflow-y: auto; padding: 18px 22px; font-size: 14px; line-height: 1.6; }
      #docs-content h1 { font-size: 20px; color: #edf4ff; margin: 0 0 12px; }
      #docs-content h2 { font-size: 16px; color: #ffd54a; margin: 18px 0 8px; }
      #docs-content h3 { font-size: 14px; color: #5eead4; margin: 14px 0 6px; }
      #docs-content pre { background: rgba(0,0,0,.35); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
      #docs-content code { background: rgba(0,0,0,.3); padding: 1px 4px; border-radius: 4px; font-size: 12px; }
      #docs-content pre code { background: none; padding: 0; }
      #docs-content blockquote { border-left: 3px solid #ffd54a; margin: 10px 0; padding: 4px 12px; color: #ffd54a; background: rgba(255,213,74,.06); }
      #docs-content table { border-collapse: collapse; }
      #docs-content td, #docs-content th { border: 1px solid rgba(255,255,255,.12); padding: 4px 10px; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="left">
        <div id="left-head"><strong>Tools</strong></div>
        <div id="left-body"></div>
      </div>
      <canvas id="canvas"></canvas>
      <div id="panel">
        <h1>Avatar Rig Test</h1>
        <a href="/master.html" style="display:block;text-align:center;padding:8px;border-radius:8px;border:1px solid rgba(94,234,212,.5);color:#5eead4;text-decoration:none;margin-bottom:8px;">Master Avatar →</a>
        <button id="avatar-dev" style="width:100%;padding:8px;border-radius:8px;border:1px solid rgba(94,234,212,.5);background:rgba(94,234,212,.12);color:#5eead4;cursor:pointer;margin-bottom:8px;">Avatar Development</button>
        <div class="sect">Camera</div>
        <div class="views" id="views"></div>
        <div id="controls"></div>
        <button id="reset">Reset</button>
        <div class="sect">Camera</div>
        <div id="camdebug"></div>
        <div class="sect">Debug</div>
        <div id="debug"></div>
      </div>
    </div>
    <div id="docs-overlay" hidden>
      <div id="docs-modal">
        <div id="docs-head">
          <strong>Avatar Development</strong>
          <button id="docs-close">✕</button>
        </div>
        <div id="docs-body">
          <div id="docs-nav"></div>
          <div id="docs-content"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/shoulder-test.ts"></script>
  </body>
</html>
